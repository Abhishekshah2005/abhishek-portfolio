name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a new push cancels an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      # GITHUB_PAGES=true switches on next.config.ts's basePath
      # (/abhishek-portfolio) so every route and asset resolves under the
      # project-pages subpath GitHub actually serves this at.
      - run: pnpm build
        env:
          GITHUB_PAGES: "true"

      - uses: actions/configure-pages@v5

      # Also stamps a .nojekyll file into the artifact automatically —
      # without it, GitHub Pages' Jekyll processing ignores the _next/
      # directory (leading underscore) and every JS/CSS chunk 404s.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
